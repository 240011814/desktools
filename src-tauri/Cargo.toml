[package]
name = "desktools"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
rumqttc = "0.25"
# 文件中转站：S3 兼容客户端（TLS 复用依赖树里已有的 rustls + ring）
rust-s3 = { version = "0.38", default-features = false, features = ["tokio-rustls-tls-ring", "fail-on-err"] }
tokio = { version = "1", features = ["time", "fs", "io-util"] }
uuid = { version = "1", features = ["v4"] }
# 配置文件中 MinIO 凭据的机器绑定加密（HKDF-SHA256 + AES-256-GCM）
ring = "0.17"
base64 = "0.22"
machine-uid = "0.6"
# macOS 系统锁屏接口（SACLockScreenImmediate）dlopen 用
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# 注意：lto 用 thin 而非 full、codegen-units 不设 1——full LTO + CGU=1 会让 CI 编译
# 多花 3~5 分钟（universal 构建还要 ×2），产物体积/性能差异几乎可忽略。
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
# 测试用（file_hub 的 #[tokio::test]）
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
