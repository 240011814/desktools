name: Release

# 每次推送到 main 都构建 Windows/macOS 并发布到 GitHub Releases（无需手动打 tag）
# 版本号基于 git 提交自动生成：1.0.<提交数>+<短SHA>，发布 tag 为 v1.0.<提交数>-<短SHA>
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # macOS (Apple Silicon)
          - platform: windows-latest # Windows (x64)
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史统计提交数

      - name: Compute version from git commit
        id: version
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          COUNT=$(git rev-list --count HEAD)
          VERSION="1.0.${COUNT}+${SHORT_SHA}"
          export VERSION
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
          "

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: desktools-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version from git commit
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          COUNT=$(git rev-list --count HEAD)
          echo "version=1.0.${COUNT}+${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=v1.0.${COUNT}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          pattern: desktools-*
          path: bundles
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: desktools ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            自动构建，版本 `${{ steps.version.outputs.version }}`（commit `${{ github.sha }}`）

            - macOS：`.dmg`
            - Windows：`.exe`（NSIS）/ `.msi`

            > macOS 产物未签名，首次打开需在「系统设置 → 隐私与安全性」中允许。
          files: |
            bundles/**/*.dmg
            bundles/**/*.app.tar.gz
            bundles/**/*.msi
            bundles/**/*.exe
          fail_on_unmatched_files: true
