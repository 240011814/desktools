name: Release

# 每次推送到 main 都构建 Windows/macOS、签名并发布到 GitHub Releases（无需手动打 tag）
# 版本号基于 git 提交自动生成：1.0.<提交数>（MSI 要求纯数字），短 SHA 进 release 标题
# tauri-action 自动生成 latest.json 更新清单并上传签名产物，供应用内自动更新
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      max-parallel: 1 # 串行发布，避免 latest.json 多平台合并竞态
      matrix:
        include:
          - platform: macos-latest # macOS：universal 包（Apple Silicon + Intel）
            tauri-args: --target universal-apple-darwin
          - platform: windows-latest # Windows (x64)
            tauri-args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史统计提交数

      - name: Compute version from git commit
        id: version
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          COUNT=$(git rev-list --count HEAD)
          VERSION="1.0.${COUNT}"
          export VERSION
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "title=desktools ${VERSION} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION (commit $SHORT_SHA)"
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
          "

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS build targets (arm64 + x86_64)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build and publish to GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名私钥（由 tauri signer generate 生成，存放在仓库 Secret 中）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 无 Apple 开发者账号时用 ad-hoc 签名，保证 .app 签名有效
          # （签名无效的产物在 macOS 上会提示「文件已损坏」）
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: ${{ steps.version.outputs.title }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.tauri-args }}
          # 包装脚本：构建后做签名/架构自检，坏包直接失败（见 scripts/tauri-build.sh）
          tauriScript: bash scripts/tauri-build.sh
          releaseBody: |
            自动构建，版本 `${{ steps.version.outputs.version }}`（commit `${{ github.sha }}`）

            - macOS：`.dmg`（universal，Apple Silicon / Intel 通用）
            - Windows：`.exe`（NSIS）/ `.msi`

            > **macOS 安装提示**：产物未做 Apple 公证，首次打开若提示"无法验证开发者"，
            > 请右键 → 打开，或执行 `xattr -cr /Applications/desktools.app` 后再打开。
