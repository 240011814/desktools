name: CI

# gitflow 分支构建：develop / release/* / hotfix/* / feature/* 以及 PR
# main 的推送由 release.yml 负责，每次推送都会构建并发布到 GitHub Releases
on:
  push:
    branches:
      - develop
      - "release/**"
      - "hotfix/**"
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # macOS：universal 包（Apple Silicon + Intel）
            tauri-args: --target universal-apple-darwin
          - platform: windows-latest # Windows (x64)
            tauri-args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS build targets (arm64 + x86_64)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # 质量门禁：lint / 测试 / 格式 / 静态检查不通过则不构建
      - name: Frontend lint
        run: pnpm lint

      - name: Frontend unit tests
        run: pnpm test:unit

      - name: Rust fmt check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build Tauri app
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: bash scripts/tauri-build.sh build ${{ matrix.tauri-args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: desktools-${{ matrix.platform }}
          path: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.app.tar.gz
            src-tauri/target/**/bundle/**/*.msi
            src-tauri/target/**/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 14
